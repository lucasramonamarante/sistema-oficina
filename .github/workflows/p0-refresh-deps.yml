name: Update safe dependency lockfile versions
on:
  push:
    branches: [security/p0-hardening-20261121]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/p0-hardening-20261121
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply compatible advisory fixes to lockfile only
        run: npm audit fix --package-lock-only --ignore-scripts || true
      - name: Commit lockfile changes on isolated branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No compatible lockfile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(security): resolve compatible dependency advisories"
          git push origin HEAD:refs/heads/security/p0-hardening-20261121
